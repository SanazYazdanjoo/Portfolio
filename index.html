<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Self-hosted fonts (see src/styles/fonts.css). Only the two faces
         needed above the fold (Nav wordmark, Home hero name/tagline) are
         preloaded; Caveat is font-display:optional and deliberately not
         preloaded — it's allowed to arrive late or not at all. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/bricolage-grotesque-latin-variable.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/dm-sans-latin-variable.woff2" crossorigin />
    <!-- ── Identity ── -->
    <title>Sanaz Yazdanjoo — UX Engineer</title>
    <meta
      name="description"
      content="UX Engineer with an M.Sc. in Human-Computer Interaction. Mixed-methods research and production React — case studies with methods, numbers, and honest limits."
    />
    <meta name="author" content="Sanaz Yazdanjoo" />

    <!-- ── Open Graph / Twitter ── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yazdanjoo.de" />
    <meta property="og:title" content="Sanaz Yazdanjoo — UX Engineer" />
    <meta property="og:description" content="UX Engineer with an M.Sc. in Human-Computer Interaction." />
    <!-- og-card.png is generated (scripts/generate-og-image.mjs): the raw
         square portrait got its forehead/chin cropped off by every 1.91:1
         unfurler. Served from the root, not /assets/, for the same
         cache-correctness reason as the favicons below. -->
    <meta property="og:image" content="https://yazdanjoo.de/og-card.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sanaz Yazdanjoo — UX Engineer" />
    <meta name="twitter:description" content="UX Engineer with an M.Sc. in Human-Computer Interaction." />
    <meta name="twitter:image" content="https://yazdanjoo.de/og-card.png" />

    <!-- ── Favicons ──
         The SVG carries its own prefers-color-scheme rule, so the mark
         switches ink with the BROWSER's chrome. That is deliberately not the
         site's own theme toggle and must never be wired to it: a visitor
         reading the site in light theme inside a dark-chrome browser needs
         the light-chrome mark, and the two settings disagree all the time.

         The raster fallbacks cannot switch, so they carry their own coral
         ground instead of depending on whatever sits behind them — one
         variant that survives both chromes. iOS composites its own
         background behind apple-touch-icon, so that one in particular has
         to be the opaque chip, never a transparent glyph.

         Served from the site root, not /assets/: vercel.json marks /assets/*
         immutable for a year, which is right for hashed build output and
         wrong for a file whose entire purpose is to be corrected in place.

         Regenerate all of it with: node scripts/generate-favicons.mjs -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="alternate icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    
    <!-- Cookiebot — must load before any tracker so consent gates them -->
    <script id="Cookiebot" src="https://consent.cookiebot.com/uc.js" data-cbid="cb504ac2-0680-40c4-9de7-659565f4c602" type="text/javascript" async></script>

    <!-- Google Analytics — consent-gated: type="text/plain" keeps both
         scripts inert until Cookiebot flips them to text/javascript after
         the visitor consents to the "statistics" category. Do not remove
         the data-cookieconsent attribute, or GA runs before consent. -->
    <script type="text/plain" data-cookieconsent="statistics" async src="https://www.googletagmanager.com/gtag/js?id=G-20Q8K2V97V"></script>
    <script type="text/plain" data-cookieconsent="statistics">
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-20Q8K2V97V');
    </script>
  </head>
  <!-- No utility class on body: index.css already paints it var(--bg) in the
       base layer, and a utilities-layer bg-white outranked that — keeping the
       document ground white in dark mode (visible on overscroll). -->
  <body>
    <div id="root" class=""></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
