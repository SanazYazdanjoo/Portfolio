name: Migrate data.json SSOT

on:
  push:
    branches:
      - content/unify-about-cv-narrative
    paths:
      - .github/workflows/migrate-data-ssot.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/unify-about-cv-narrative
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Migrate canonical data
        run: node scripts/migrate-data-json-ssot.mjs
      - name: Commit migrated data
        run: |
          if git diff --quiet -- src/data/data.json; then
            echo "No data migration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/data.json
          git commit -m "Move canonical website content into data.json"
          git push origin HEAD:content/unify-about-cv-narrative
